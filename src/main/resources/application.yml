spring:
  application:
    name: carava-carwash-customer

  datasource:
    url: jdbc:postgresql://localhost:5432/carvana
    username: carvana_admin
    password: Carvana2024!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: "carwash-jwt-secret-key-for-authentication-and-authorization-process-must-be-256-bits-long"
  access-token-expire-time: 3600000 # 1시간 (ms)
  refresh-token-expire-time: 604800000 # 7일 (ms)

# MinIO 설정 (AWS S3 호환)
minio:
  endpoint: http://158.179.171.102:9000
  access-key: carvana_admin
  secret-key: Carvana2024!
  bucket-name: carava-bucket

# 이미지 처리 설정
image:
  thumbnail:
    width: 300
    height: 300
  medium:
    width: 800
    height: 600
  max-width: 4096
  max-height: 4096

logging:
  level:
    com.carava.carwash: DEBUG
    org.springframework.security: DEBUG
