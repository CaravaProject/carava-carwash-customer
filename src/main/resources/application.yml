spring:
  application:
    name: carava-carwash-customer

  datasource:
    url: jdbc:postgresql://localhost:5432/carvana
    username: carvana_admin
    password: Carvana2024!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    data:
      web:
        pageable:
          default-page-size: 20
          max-page-size: 100

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: "carwash-jwt-secret-key-for-authentication-and-authorization-process-must-be-256-bits-long"
  access-token-expire-time: 3600000 # 1시간 (ms)
  refresh-token-expire-time: 604800000 # 7일 (ms)

logging:
  level:
    com.carava.carwash: DEBUG
    org.springframework.security: DEBUG
